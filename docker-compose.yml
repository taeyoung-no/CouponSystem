services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:8.0
    ports:
      - "6379:6379"

volumes:
  mysql-data:
