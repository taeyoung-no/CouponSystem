server:
  port: 8090

spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: member-api
              uri: http://localhost:8080
              predicates:
                - Path=/api/member/**
            - id: user-api
              uri: http://localhost:8080
              predicates:
                - Path=/api/waiting-queue/**,/api/coupon/*/issue
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@memberIdKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
            - id: admin-api
              uri: http://localhost:8080
              predicates:
                - Path=/api/coupon,/api/coupon/*/reconcile,/api/coupon/dlt/**

jwt:
  secret: jwt-secret-1234567890-very-long-string
